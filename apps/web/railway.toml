[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"
watchPatterns = [
  "/apps/web/**",
  "/packages/api/**",
  "/packages/auth/**",
  "/packages/jobs/**",
  "/package.json",
  "/.nvmrc",
  "/railpack.json",
  "/Dockerfile",
  "/.dockerignore",
  "/pnpm-workspace.yaml",
  "/scripts/update-security-ca.sh",
  "/pnpm-lock.yaml",
  "/turbo.json",
]

[deploy]
preDeployCommand = "pnpm --filter @mt/api exec prisma migrate deploy"
startCommand = "sh apps/web/scripts/start-production.sh"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
