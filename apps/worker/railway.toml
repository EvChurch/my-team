[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"
watchPatterns = [
  "/apps/worker/**",
  "/packages/api/**",
  "/packages/jobs/**",
  "/package.json",
  "/.nvmrc",
  "/railpack.json",
  "/Dockerfile",
  "/.dockerignore",
  "/pnpm-workspace.yaml",
  "/scripts/update-security-ca.sh",
  "/pnpm-lock.yaml",
  "/turbo.json",
]

[deploy]
startCommand = "node apps/worker/dist/index.js"
drainingSeconds = 35
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
